[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-context"
version = "1.1.0"
description = "AI context engine for Power BI models: indexed, queryable context for LLM agents (MCP server, CLI, docs), zero dependencies"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Oscar Rosero", email = "orosero2405@gmail.com"}]
keywords = ["powerbi", "metadata", "dax", "documentation", "bi", "pbit", "mcp", "ai-agent", "llm-context"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Documentation",
  "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/Osc2405/pbi-context"
Repository = "https://github.com/Osc2405/pbi-context"
Issues = "https://github.com/Osc2405/pbi-context/issues"
Changelog = "https://github.com/Osc2405/pbi-context/blob/main/CHANGELOG.md"

[project.scripts]
pbi-context = "pbi_extractor.cli:main"

[tool.setuptools]
packages = ["pbi_extractor"]


